<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="center"><main class="card narrow"><h1>Barcode Check</h1><p class="muted">Sign in to continue.</p>{{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}<form method="post" action="/login"><label>Login<input name="login" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
