<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scan</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div><strong>Barcode Check</strong><span class="muted"> — {{.User.Name}}</span></div>
  <nav>
    {{if eq .User.Role "admin"}}<a href="/admin">Admin</a>{{end}}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{.User.CSRF}}">
      <button class="linkbtn">Logout</button>
    </form>
  </nav>
</header>

<main class="scan-main scancontainer" data-csrf="{{.User.CSRF}}">

  <!-- Today counter -->
  <div class="today-bar">
    <span class="today-label">Today's scans</span>
    <span class="today-count" id="todayCount">0</span>
  </div>

  <!-- Camera section -->
  <section class="camera-card">
    <div class="video-wrap">
      <div id="video"></div>
      <!-- Scan frame overlay -->
      <div class="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line" id="scanLine"></div>
      </div>
      <div class="video-hint" id="videoHint">Point barcode at the frame</div>
    </div>

    <div class="camera-actions">
      <button id="startCamera" type="button" class="cam-btn start">▶ Start Camera</button>
      <button id="stopCamera" type="button" class="cam-btn stop" disabled>■ Stop</button>
    </div>
    <p id="cameraHelp" class="muted small center-text">Camera requires HTTPS or localhost.</p>
  </section>

  <!-- Result card — big and prominent -->
  <section id="result" class="result-card hidden" aria-live="polite">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-item" id="resultItem"></div>
    <div class="result-msg" id="resultMsg"></div>
  </section>

  <!-- Manual entry -->
  <section class="manual-card">
    <div class="manual-row">
      <input id="barcodeInput" inputmode="numeric" autocomplete="off"
             placeholder="Enter barcode number" class="barcode-input">
      <button id="submitBarcode" type="button" class="check-btn">Check</button>
    </div>
    <div class="upload-scan-row">
      <label for="imageUpload" class="upload-scan-btn">📷 Scan from Image</label>
      <input type="file" id="imageUpload" accept="image/*" style="display:none">
    </div>
  </section>

</main>

<div id="__img_scanner__" style="display:none"></div>
<script src="/static/scan.js"></script>
</body>
</html>
